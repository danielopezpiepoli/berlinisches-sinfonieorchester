<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo marfil/off-white con borde sutil para contraste en pestañas oscuras -->
  <rect width="64" height="64" rx="12" fill="#fdfbf7" stroke="#e0dcce" stroke-width="2"/>
  
  <!-- Letra 'B' con serif en negro mate -->
  <text x="32" y="44" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="42" 
        font-weight="700" 
        fill="#1a1a1a" 
        text-anchor="middle">B</text>
        
  <!-- Acento/subrayado dorado -->
  <rect x="18" y="50" width="28" height="3" fill="#c5a059" rx="1.5"/>
</svg>
